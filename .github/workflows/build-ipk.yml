name: Build XboxLink webOS app

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - ".github/workflows/build-ipk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli
      - name: Create app icon
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          image = Image.new("RGBA", (80, 80), (7, 18, 12, 255))
          draw = ImageDraw.Draw(image)
          draw.rounded_rectangle((5, 5, 75, 75), radius=16, fill=(20, 70, 35, 255))
          draw.rounded_rectangle((17, 22, 63, 58), radius=8, outline=(142, 230, 142, 255), width=5)
          draw.ellipse((29, 33, 39, 43), fill=(142, 230, 142, 255))
          draw.ellipse((44, 33, 54, 43), fill=(142, 230, 142, 255))
          image.save("app/icon.png")
          PY
      - name: Package webOS app
        run: |
          mkdir -p dist
          ares-package -o dist app
      - uses: actions/upload-artifact@v4
        with:
          name: XboxLink-LG-IPK
          path: dist/*.ipk
          if-no-files-found: error
